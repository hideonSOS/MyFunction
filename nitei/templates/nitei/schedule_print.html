{% load static %}<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>勤務表 印刷</title>
<link rel="stylesheet" href="{% static 'nitei/css/schedule_print.css' %}?v=20260928b">
<style id="sp-page-size">@page { size: A4 landscape; margin: 8mm; }</style>
</head>
<body class="paper-a4">

<!-- 画面表示時のみのツールバー（印刷には出ない） -->
<div class="sp-toolbar">
  <span class="sp-title">勤務表 印刷プレビュー（{{ person_name }}）</span>
  <button type="button" id="sp-prev" title="前の勤務表">◀</button>
  <span id="sp-sheet"></span>
  <button type="button" id="sp-next" title="次の勤務表">▶</button>
  <select id="sp-paper" title="用紙">
    <option value="a4">A4横</option>
    <option value="a3">A3横</option>
  </select>
  <span class="sp-hint">「印刷 / PDF保存」→ 送信先で「PDFに保存」を選ぶとPDFになります</span>
  <span class="sp-spacer"></span>
  <button type="button" id="sp-print">🖨 印刷 / PDF保存</button>
  <button type="button" id="sp-close">閉じる</button>
</div>

<div id="sp-page" class="sp-page">読み込み中...</div>

<script>
  const PERSON      = "{{ person|escapejs }}";
  const PERSON_NAME = "{{ person_name|escapejs }}";
  const SHEET_PARAM = "{{ sheet_param|escapejs }}";
</script>
<script src="{% static 'nitei/js/periods.js' %}"></script>
<script src="{% static 'nitei/js/schedule_print.js' %}?v=20260928"></script>
</body>
</html>
