{% load static %}<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>全員一覧 印刷</title>
<link rel="stylesheet" href="{% static 'nitei/css/overview_print.css' %}?v=20260928b">
<style id="op-page-size">@page { size: A3 landscape; margin: 8mm; }</style>
</head>
<body class="paper-a3">

<!-- 画面表示時のみのツールバー（印刷には出ない） -->
<div class="op-toolbar">
  <span class="op-title">全員一覧 印刷プレビュー</span>
  <button type="button" id="op-prev" title="前の月">◀</button>
  <span id="op-month"></span>
  <button type="button" id="op-next" title="次の月">▶</button>
  <select id="op-paper" title="用紙">
    <option value="a3">A3横</option>
    <option value="a4">A4横</option>
  </select>
  <span class="op-hint">「印刷 / PDF保存」→ 送信先で「PDFに保存」を選ぶとPDFになります</span>
  <span class="op-spacer"></span>
  <button type="button" id="op-print">🖨 印刷 / PDF保存</button>
  <button type="button" id="op-close">閉じる</button>
</div>

<div id="op-page" class="op-page">読み込み中...</div>

<script>
  const PERSONS     = {{ persons_json|safe }};
  const MONTH_PARAM = "{{ month_param|escapejs }}";
</script>
<script src="{% static 'nitei/js/periods.js' %}"></script>
<script src="{% static 'nitei/js/overview_data.js' %}?v=20260928"></script>
<script src="{% static 'nitei/js/overview_print.js' %}?v=20260928"></script>
</body>
</html>
